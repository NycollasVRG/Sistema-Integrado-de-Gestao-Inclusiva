spring:
  datasource:
    url: jdbc:h2:mem:sigi_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS sigi
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: sigi

  flyway:
    enabled: false

sigi:
  security:
    jwt-secret: sigi-clai-test-jwt-secret-key-2026-ifpb-32bytes-min
    aes-key: 0123456789abcdef0123456789abcdef
  cors:
    allowed-origins: http://localhost:5173
