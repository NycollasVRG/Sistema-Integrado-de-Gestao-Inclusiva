server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: CLAI

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:sigi}

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:sigi}
    default-schema: ${DB_SCHEMA:sigi}
    locations: classpath:db/migration

sigi:
  security:
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  storage:
    attachments-dir: ${ATTACHMENTS_STORAGE_PATH:/app/storage/anexos}
  ia:
    base-url: ${IA_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:}
    connect-timeout-ms: ${IA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${IA_READ_TIMEOUT_MS:30000}
  atas:
    lembrete:
      antecedencia-dias: ${ATAS_LEMBRETE_ANTECEDENCIA_DIAS:3}
      cron: ${ATAS_LEMBRETE_CRON:0 0 8 * * *}
      zone: ${ATAS_LEMBRETE_ZONE:America/Fortaleza}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized