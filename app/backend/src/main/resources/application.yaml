server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: CLAI

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:sigi}

sigi:
  security:
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  storage:
    attachments-dir: ${ATTACHMENTS_STORAGE_PATH:/app/storage/anexos}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized