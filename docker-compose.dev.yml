services:
  # ============================================================================
  # Serviço 1: Banco de Dados Relacional (PostgreSQL 16) - DEV
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: sigi-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigi_clai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Fortaleza
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Persistência dos dados de desenvolvimento (schema e seeds gerenciados pelo Flyway)
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - sigi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sigi_clai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Serviço 2: Backend API (Java 21 + Spring Boot) - DEV
  # ============================================================================
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: sigi-backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sigi_clai}
      DB_SCHEMA: ${DB_SCHEMA:-sigi}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sigi_clai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-sigi-clai-dev-jwt-secret-key-2026-ifpb-change-in-prod}
      AES_KEY: ${AES_KEY:-0123456789abcdef0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ATTACHMENTS_STORAGE_PATH: ${ATTACHMENTS_STORAGE_PATH:-/app/storage/anexos}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - attachments_dev_data:${ATTACHMENTS_STORAGE_PATH:-/app/storage/anexos}
    networks:
      - sigi-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Serviço 3: Frontend SPA (React 19 + Vite + Nginx) - DEV
  # ============================================================================
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_USE_LOCAL_FALLBACK: ${VITE_USE_LOCAL_FALLBACK:-false}
    container_name: sigi-frontend-dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - sigi-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_dev_data:
    name: sigi_postgres_dev_data
  attachments_dev_data:
    name: sigi_attachments_dev_data

networks:
  sigi-network:
    name: sigi-network
    driver: bridge
