spring:
  application:
    name: CLAI

  datasource:
    url: jdbc:postgresql://localhost:5432/sigi_clai
    username: ${GROUP_DB_USER:postgres}
    password: ${GROUP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: sigi